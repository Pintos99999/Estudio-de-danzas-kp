<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1000" width="480" height="1000" role="img" aria-label="Silueta de bailarina de ballet en puntas, con los brazos en corona">
  <defs>
    <linearGradient id="cuerpo" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#2E3878"/>
      <stop offset="45%"  stop-color="#131B3E"/>
      <stop offset="100%" stop-color="#05070F"/>
    </linearGradient>
    <linearGradient id="falda" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#8A88CB" stop-opacity=".78"/>
      <stop offset="30%"  stop-color="#464F9E" stop-opacity=".42"/>
      <stop offset="70%"  stop-color="#1E2856" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#0B1026" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="falda2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#B3B1E8" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#2A3468" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="borde" x1="0.1" y1="0" x2="0.9" y2="0.8">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".8"/>
      <stop offset="50%"  stop-color="#C9C7FF" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#F45C9C" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%"   stop-color="#B6B4E6" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#B6B4E6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="240" cy="470" rx="240" ry="400" fill="url(#halo)"/>

  <g>
    <!-- PIERNAS + ZAPATILLAS DE PUNTA -->
    <g stroke="url(#cuerpo)" stroke-linecap="round" fill="none">
      <path d="M254 560c4 96 4 192 0 286" stroke-width="26"/>
      <path d="M228 560c-4 96-6 192-4 286" stroke-width="23"/>
    </g>
    <path fill="#0A0E22" d="M243 842c9 0 15 22 15 46s-6 34-15 34-15-10-15-34 6-46 15-46z"/>
    <path fill="#0A0E22" d="M221 846c9 0 14 20 14 43s-5 32-14 32-14-9-14-32 5-43 14-43z"/>

    <!-- TORSO -->
    <path fill="url(#cuerpo)"
      d="M196 250c-8 30-10 66-5 102 4 28 9 50 14 66h70c5-16 10-38 14-66 5-36 3-72-5-102-26-10-62-10-88 0z"/>

    <!-- CUELLO + CABEZA -->
    <path fill="url(#cuerpo)" d="M225 204h30v48h-30z"/>
    <ellipse cx="240" cy="184" rx="27" ry="31" fill="url(#cuerpo)"/>
    <ellipse cx="240" cy="150" rx="17" ry="13" fill="url(#cuerpo)"/>

    <!-- BRAZOS EN CORONA -->
    <path d="M196 254c-54-30-58-98 4-120 26-9 54-9 80 0 62 22 58 90 4 120"
          fill="none" stroke="url(#cuerpo)" stroke-width="19" stroke-linecap="round"/>

    <!-- FALDA ROMÁNTICA -->
    <path fill="url(#falda)"
      d="M198 408c-44 26-80 76-102 140-14 40-22 80-24 114 30 30 56 6 86 20 30 14 50-12 80 0 30 12 50-14 80-2 26 10 44-12 70-2-4-36-14-78-32-118-28-62-66-114-92-142z"/>
    <path fill="url(#falda2)"
      d="M204 412c-32 22-58 60-76 106-10 26-17 50-21 72 50 22 146 24 212 2-4-24-12-50-25-78-20-44-52-80-90-102z"/>
    <path fill="none" stroke="#C9C7FF" stroke-opacity=".2" stroke-width="1.4"
      d="M120 580c58 22 186 26 244 2"/>
  </g>

  <!-- LUZ DE CONTORNO -->
  <g fill="none" stroke="url(#borde)" stroke-width="1.8" stroke-linecap="round" opacity=".95">
    <path d="M196 254c-54-30-58-98 4-120"/>
    <path d="M214 160c-8 9-12 22-12 36"/>
    <path d="M198 408c-42 26-76 74-98 136"/>
    <path d="M224 560c-4 96-6 192-4 286"/>
  </g>
</svg>
